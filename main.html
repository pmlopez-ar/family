// ═══════════════════════════════════════════════════════
//  MOTOR — aplicar escala y renderizar
// ═══════════════════════════════════════════════════════
const R = 20, GH = 140, OY = 60;
const pmap = {};

// Aplicar escala horizontal a todas las personas
const FAMILIA = {
  ...FAMILIA_RAW,
  personas: FAMILIA_RAW.personas.map(p => ({ ...p, x: sx(p.x) }))
};

FAMILIA.personas.forEach(p => { p.y = OY + p.generacion * GH + R; pmap[p.id] = p; });

function iniciales(n) {
  return n.split(" ").slice(0,2).map(w => w[0]||"").join("").toUpperCase();
}

// ── Render SVG ──────────────────────────────────────────
function render() {
  const svg = document.getElementById("svg");
  const maxX = Math.max(...FAMILIA.personas.map(p => p.x));
  const W = maxX + 80;
  const H = OY + 5 * GH + 20;

  // Ajustar al ancho del viewport
  svg.setAttribute("width",  W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.maxWidth = "100%";
  svg.style.width = W + "px";
  svg.innerHTML = "";

  // defs para clips de fotos
  const defs = document.createElementNS("http://www.w3.org/2000/svg","defs");
  FAMILIA.personas.forEach(p => {
    if (!p.foto) return;
    const clip = document.createElementNS("http://www.w3.org/2000/svg","clipPath");
    clip.setAttribute("id","clip"+p.id);
    const cc = document.createElementNS("http://www.w3.org/2000/svg","circle");
    cc.setAttribute("cx",p.x); cc.setAttribute("cy",p.y); cc.setAttribute("r",R);
    clip.appendChild(cc); defs.appendChild(clip);
  });
  svg.appendChild(defs);

  // ── líneas ──
  const lineaG = document.createElementNS("http://www.w3.org/2000/svg","g");

  function seg(x1,y1,x2,y2,col,sw,dash) {
    const l = document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",x1); l.setAttribute("y1",y1);
    l.setAttribute("x2",x2); l.setAttribute("y2",y2);
    l.setAttribute("stroke", col||"#b8a87a");
    l.setAttribute("stroke-width", sw||"1.5");
    if (dash) l.setAttribute("stroke-dasharray", dash);
    lineaG.appendChild(l);
  }

  FAMILIA.parejas.forEach(([id1,id2,hijos,esUnion]) => {
    const p1 = pmap[id1];
    const p2 = id2 ? pmap[id2] : null;
    const ch = hijos.map(id => pmap[id]).filter(Boolean);
    if (!p1 || ch.length === 0) return;

    const topLine = p1.y + R;
    const botLine = ch[0].y - R;
    const lineY   = topLine + (botLine - topLine) * 0.5;

    if (p2) {
      const midX = (p1.x + p2.x) / 2;
      const cPar = esUnion ? "#8fad6a" : "#c4b99a";
      const wPar = esUnion ? "2.5" : "1.5";
      seg(p1.x + R, p1.y, p2.x - R, p2.y, cPar, wPar, esUnion ? "5,3" : null);
      if (esUnion) {
        const ht = document.createElementNS("http://www.w3.org/2000/svg","text");
        ht.setAttribute("x",midX); ht.setAttribute("y",p1.y+5);
        ht.setAttribute("text-anchor","middle"); ht.setAttribute("font-size","13");
        ht.setAttribute("fill","#c97d2e"); ht.textContent="♥";
        lineaG.appendChild(ht);
      }
      seg(midX, topLine, midX, lineY);
      const xs = [midX, ...ch.map(k => k.x)];
      seg(Math.min(...xs), lineY, Math.max(...xs), lineY);
      ch.forEach(k => seg(k.x, lineY, k.x, k.y - R));
    } else {
      seg(p1.x, topLine, p1.x, lineY);
      const xs = [p1.x, ...ch.map(k => k.x)];
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      if (minX < maxX) seg(minX, lineY, maxX, lineY);
      ch.forEach(k => seg(k.x, lineY, k.x, k.y - R));
    }
  });

  svg.appendChild(lineaG);

  // ── nodos ──
  FAMILIA.personas.forEach(p => {
    const fam = FAMILIA.colores[p.generacion] || FAMILIA.colores[0];
    const {x, y} = p;
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","pn");
    g.setAttribute("data-id",p.id);

    const anillo = document.createElementNS("http://www.w3.org/2000/svg","circle");
    anillo.setAttribute("class","ring");
    anillo.setAttribute("cx",x); anillo.setAttribute("cy",y); anillo.setAttribute("r",R+3);
    anillo.setAttribute("fill",fam.fondo); anillo.setAttribute("stroke",fam.color); anillo.setAttribute("stroke-width","2.5");
    g.appendChild(anillo);

    if (p.foto) {
      const im = document.createElementNS("http://www.w3.org/2000/svg","image");
      im.setAttribute("href",p.foto);
      im.setAttribute("x",x-R); im.setAttribute("y",y-R);
      im.setAttribute("width",2*R); im.setAttribute("height",2*R);
      im.setAttribute("preserveAspectRatio","xMidYMid slice");
      im.setAttribute("clip-path",`url(#clip${p.id})`);
      g.appendChild(im);
    } else {
      const circ = document.createElementNS("http://www.w3.org/2000/svg","circle");
      circ.setAttribute("cx",x); circ.setAttribute("cy",y); circ.setAttribute("r",R);
      circ.setAttribute("fill",fam.fondo); g.appendChild(circ);
      const ini = document.createElementNS("http://www.w3.org/2000/svg","text");
      ini.setAttribute("x",x); ini.setAttribute("y",y+5); ini.setAttribute("text-anchor","middle");
      ini.setAttribute("font-size","12"); ini.setAttribute("font-weight","bold");
      ini.setAttribute("fill",fam.texto); ini.setAttribute("font-family","Georgia,serif");
      ini.textContent = iniciales(p.nombre); g.appendChild(ini);
    }

    // nombre debajo
    const words = p.nombre.split(" ");
    let l1 = p.nombre, l2 = "";
    if (p.nombre.length > 13) {
      const h = Math.ceil(words.length/2);
      l1 = words.slice(0,h).join(" "); l2 = words.slice(h).join(" ");
    }
    const txt = (t,dy) => {
      const el = document.createElementNS("http://www.w3.org/2000/svg","text");
      el.setAttribute("x",x); el.setAttribute("y",y+R+dy);
      el.setAttribute("text-anchor","middle"); el.setAttribute("font-size","9");
      el.setAttribute("fill","#3d2e1a"); el.setAttribute("font-weight","bold");
      el.setAttribute("font-family","Georgia,serif");
      el.textContent = t; g.appendChild(el);
    };
    txt(l1, l2?11:13); if(l2) txt(l2,22);
    if (p.nacimiento) {
      const bt = document.createElementNS("http://www.w3.org/2000/svg","text");
      bt.setAttribute("x",x); bt.setAttribute("y",y+R+(l2?33:24));
      bt.setAttribute("text-anchor","middle"); bt.setAttribute("font-size","8");
      bt.setAttribute("fill","#8b7355"); bt.setAttribute("font-family","Georgia,serif");
      bt.textContent = p.nacimiento + (p.fallecimiento?`–${p.fallecimiento}`:"");
      g.appendChild(bt);
    }

    g.addEventListener("mouseenter", e => abrirModal(p.id));
    g.addEventListener("mouseleave", () => cerrarModal());
    svg.appendChild(g);
  });

  // etiquetas generación
  FAMILIA.generaciones.forEach((lb,i) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",8); t.setAttribute("y", OY+i*GH+R+4);
    t.setAttribute("font-size","9"); t.setAttribute("fill","#a09070");
    t.setAttribute("font-style","italic"); t.setAttribute("font-family","Georgia,serif");
    t.textContent = lb; svg.appendChild(t);
  });

  // Ajustar el wrap al ancho real del SVG
  fitToWindow(W);
}

function fitToWindow(svgW) {
  const wrap = document.getElementById("tree-wrap");
  const availW = window.innerWidth - 32; // margen
  if (svgW <= availW) {
    // entra sin scroll: escalar el SVG para que ocupe el ancho disponible
    const svg = document.getElementById("svg");
    svg.style.width  = "100%";
    svg.style.height = "auto";
    wrap.style.overflowX = "hidden";
  } else {
    wrap.style.overflowX = "auto";
  }
}

// ── Modal (hover) ────────────────────────────────────────
let closeTimer = null;

function abrirModal(id) {
  const p = pmap[id]; if (!p) return;
  const fam = FAMILIA.colores[p.generacion] || FAMILIA.colores[0];
  if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }

  const av = document.getElementById("modal-avatar");
  av.style.background  = fam.fondo;
  av.style.color       = fam.texto;
  av.style.borderColor = fam.color;
  av.innerHTML = p.foto
    ? `<img src="${p.foto}" alt="${p.nombre}">`
    : iniciales(p.nombre);

  document.getElementById("modal-name").textContent = p.nombre;

  let genTxt = FAMILIA.generaciones[p.generacion] || "";
  if (p.nacimiento) genTxt += `  ·  ${p.nacimiento}${p.fallecimiento?" – "+p.fallecimiento:""}`;
  document.getElementById("modal-gen").textContent = genTxt;
  document.getElementById("modal-bio").textContent = p.descripcion || "";

  const svgEl  = document.getElementById("svg");
  const rect   = svgEl.getBoundingClientRect();
  const vw     = window.innerWidth;
  const vh     = window.innerHeight;
  const mw     = 270;

  const scaleX = rect.width  / parseFloat(svgEl.getAttribute("width"));
  const scaleY = rect.height / parseFloat(svgEl.getAttribute("height"));
  const nodeScreenX = rect.left + p.x * scaleX;
  const nodeScreenY = rect.top  + p.y * scaleY;
  const nodeR = (R + 3) * scaleX;

  let left = nodeScreenX + nodeR + 12;
  if (left + mw > vw - 10) left = nodeScreenX - nodeR - mw - 12;
  left = Math.max(8, left);

  const overlay = document.getElementById("modal-overlay");
  overlay.classList.add("open");
  const mh = overlay.querySelector("#modal").offsetHeight || 350;
  let top = nodeScreenY - mh / 2;
  top = Math.max(8, Math.min(top, vh - mh - 8));

  overlay.style.left = left + "px";
  overlay.style.top  = top  + "px";
}

function cerrarModal() {
  closeTimer = setTimeout(() => {
    document.getElementById("modal-overlay").classList.remove("open");
  }, 120);
}

document.getElementById("modal-overlay").addEventListener("mouseenter", () => {
  if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
});
document.getElementById("modal-overlay").addEventListener("mouseleave", cerrarModal);

// ── Leyenda ──────────────────────────────────────────────
function renderLeyenda() {
  const div = document.getElementById("legend");
  FAMILIA.generaciones.forEach((nombre, i) => {
    const fam = FAMILIA.colores[i];
    const item = document.createElement("div");
    item.className = "leg-item";
    item.innerHTML = `<div class="leg-dot" style="background:${fam.fondo};border-color:${fam.color}"></div>${nombre}`;
    div.appendChild(item);
  });
}

render();
renderLeyenda();
window.addEventListener("resize", () => {
  const maxX = Math.max(...FAMILIA.personas.map(p => p.x));
  fitToWindow(maxX + 80);
});
</script>
